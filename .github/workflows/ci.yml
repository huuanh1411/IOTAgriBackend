name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore IOTAgriBackend.Tests/IOTAgriBackend.Tests.csproj

      - name: Test
        run: dotnet test IOTAgriBackend.Tests/IOTAgriBackend.Tests.csproj --configuration Release --no-restore

      - name: Build
        run: dotnet build IOTAgriBackend/IOTAgriBackend.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build --tag iotagri-backend:ci .
