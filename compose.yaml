services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  api:
    build: .
    ports:
      - "${API_PORT}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: IOTAgriBackend
      Jwt__Audience: IOTAgriBackendClients
      Jwt__Key: ${JWT_KEY}
      Mqtt__Host: mosquitto
      Mqtt__Port: 1883
      Mqtt__UseTls: "false"
      Mqtt__ClientId: iotagribackend-compose
      DeviceProvisioning__MqttHost: ${MQTT_PUBLIC_HOST}
      PumpScheduling__Enabled: ${PUMP_SCHEDULING_ENABLED:-false}
      PumpScheduling__PollSeconds: ${PUMP_SCHEDULING_POLL_SECONDS:-30}
      PumpScheduling__DueWindowSeconds: ${PUMP_SCHEDULING_DUE_WINDOW_SECONDS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
